
name: Publicar MapTaos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.nombre.outputs.artifact_name }}
    steps:
      - name: Identificar paquete del intento
        id: nombre
        run: echo "artifact_name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Obtener archivos
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos de MapTaos
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.nombre.outputs.artifact_name }}
          path: .

  deploy:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar MapTaos
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.preparar.outputs.artifact_name }}
